# Root-only runtime state for standalone guests: launcher bindings and the
# per-VM Firecracker vsock sockets served by runway-cache-host@.service.
d /run/runway-cache 0700 root root -
d /run/runway-cache/bindings 0700 root root -
d /run/runway-cache/vms 0700 root root -
d /run/runway-cache/assignments 0700 root root -
